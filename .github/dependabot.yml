version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
    groups:
      terraform-plugin:
        patterns:
          - "github.com/hashicorp/terraform-plugin-*"
      # Group the rest (mostly indirect dependencies from SOPS) into one PR.
      # Direct dependencies below are excluded to be updated individually.
      others:
        patterns:
          - "*"
        exclude-patterns:
          - "github.com/carlpett/terraform-provider-sops"
          - "github.com/fujiwara/sops-sakura-kms"
          - "github.com/sacloud/sacloud-sdk-go"
          - "go.yaml.in/yaml/v3"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
